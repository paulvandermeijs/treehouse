[package]
name = "treehouse"
version = "0.6.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "6"
futures = "0.3.34"
# Syntax highlighting for code blocks and the diff. Each grammar is its own
# crate, compiled once and then cached.
gpui-kit = { version = "0.8.0", features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2.7"
smol = "2.0.2"
which = "8"

[dev-dependencies]
resvg = "0.45"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# For `cargo bundle --release` (https://github.com/burtonageo/cargo-bundle),
# which builds Treehouse.app on macOS and a .deb on Linux.
[package.metadata.bundle]
name = "Treehouse"
identifier = "io.github.paulvandermeijs.treehouse"
icon = [
    "assets/icon/treehouse.icns",
    "assets/icon/png/32x32.png",
    "assets/icon/png/128x128.png",
    "assets/icon/png/256x256.png",
    "assets/icon/png/512x512.png",
]
category = "public.app-category.developer-tools"
short_description = "Run Pi coding agents in git worktrees"
# What GPUI loads at run time.
deb_depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libvulkan1", "mesa-vulkan-drivers"]
