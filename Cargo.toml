[package]
name = "treehouse"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "6"
futures = "0.3.34"
gpui-kit = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2.7"
smol = "2.0.2"
which = "8"

[dev-dependencies]
resvg = "0.45"
tempfile = "3.27.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# For `cargo bundle --release` (https://github.com/burtonageo/cargo-bundle),
# which builds Treehouse.app on macOS and a .deb on Linux.
[package.metadata.bundle]
name = "Treehouse"
identifier = "io.github.paulvandermeijs.treehouse"
icon = [
    "assets/icon/treehouse.icns",
    "assets/icon/png/32x32.png",
    "assets/icon/png/128x128.png",
    "assets/icon/png/256x256.png",
    "assets/icon/png/512x512.png",
]
category = "public.app-category.developer-tools"
short_description = "Run Pi coding agents in git worktrees"
