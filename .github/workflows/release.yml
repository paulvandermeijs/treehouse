name: Release

# A push to master that changes the version in Cargo.toml publishes a release
# named after it, with the app built for each platform. Asset names leave the
# version out, so releases/latest/download/<name> links in the docs keep
# working.
#
# Building runs every crate's build script, so the build jobs get neither the
# signing secrets nor write access: the macOS app is signed in a job of its
# own that runs no third-party build code, and only the release job can write.
# Actions are pinned to commits, with the tag they were taken from beside them.

on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x86_64
            # The oldest supported runner, so the binary runs on older glibc.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - if: runner.os != 'Windows'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-bundle

      # Unsigned: the sign-macos job signs it. ditto keeps the bundle's
      # permissions and symlinks, which an artifact upload alone would lose.
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo bundle --release --target ${{ matrix.target }}
          mkdir unsigned
          ditto -c -k --keepParent target/${{ matrix.target }}/release/bundle/osx/Treehouse.app unsigned/Treehouse.zip
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.name }}
          path: unsigned/Treehouse.zip

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo bundle --release --target ${{ matrix.target }}
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir dist
          cp $bundle/deb/*.deb dist/treehouse-${{ matrix.name }}.deb
          cp $bundle/appimage/*.AppImage dist/Treehouse-${{ matrix.name }}.AppImage

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/treehouse.exe, LICENSE -DestinationPath dist/treehouse-${{ matrix.name }}.zip

      - if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*

  # The only job with the signing secrets. It checks out this repository for
  # the signing script and runs nothing else it didn't write itself.
  sign-macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        name: [macos-arm64, macos-x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.name }}
          path: unsigned
      - name: Sign and notarize
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ditto -x -k unsigned/Treehouse.zip app
          if [ -n "$MACOS_CERTIFICATE" ]; then
            .github/scripts/sign-macos.sh app/Treehouse.app
          else
            # Without the secrets (a fork, say), an ad-hoc signature at
            # least keeps macOS from calling the downloaded app damaged.
            codesign --force --deep --sign - app/Treehouse.app
          fi
          mkdir dist
          ditto -c -k --keepParent app/Treehouse.app dist/Treehouse-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*

  release:
    needs: [version, build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Treehouse $VERSION" \
            --generate-notes
